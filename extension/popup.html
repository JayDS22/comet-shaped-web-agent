<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; }
  input, textarea, button { width: 100%; padding: 6px; margin: 4px 0; font-size: 13px; box-sizing: border-box; }
  #out { font-family: ui-monospace, monospace; font-size: 11px; background: #f4f4f4; padding: 8px; height: 200px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h3 style="margin:0 0 8px">Comet-shaped Web Agent</h3>
<label>Anthropic key <input id="key" type="password" placeholder="sk-ant-..."></label>
<button id="save">Save key (local storage)</button>
<textarea id="task" placeholder="Task prompt (e.g. 'read this page, return the H1')"></textarea>
<button id="run">Run on current tab</button>
<div id="out">Ready.</div>
<script src="popup.js"></script>
</body>
</html>
