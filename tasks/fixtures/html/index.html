<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comet Fixture - Search</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4em auto; }
  input[type="text"] { width: 100%; padding: 0.5em; font-size: 1em; }
  button { padding: 0.5em 1em; margin-top: 0.5em; font-size: 1em; }
</style>
</head>
<body>
<h1>Search fixture</h1>
<p>A deterministic search page for browser-agent evaluation. No JS, no CAPTCHA, no bot detection.</p>
<form method="get" action="results.html">
  <label for="q">Query</label>
  <input type="text" id="q" name="q" placeholder="e.g. perplexity">
  <button type="submit" id="submit">Search</button>
</form>
</body>
</html>
